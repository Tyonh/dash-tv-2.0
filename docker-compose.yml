services:
  dash-tv:
    image: nginx:1.27-alpine
    container_name: dash-tv
    restart: unless-stopped
    ports:
      - "${DASH_PORT:-8080}:80"
    volumes:
      # A pasta site/ é montada direto: um "git pull" atualiza o painel sem rebuild
      - ./site:/usr/share/nginx/html:ro
      - ./deploy/nginx/dash-tv.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
