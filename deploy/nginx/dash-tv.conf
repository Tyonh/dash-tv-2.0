# Nginx para o Dashboard TV (site estático).
# Usado pelo Docker (docker-compose.yml) e também serve para Nginx instalado direto na VPS.
# Sem Docker: troque "root" pelo caminho real da pasta site/ e "server_name" pelo domínio/IP.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # Compressão
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cabeçalhos de segurança básicos
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # HTML, JS, CSS e config sempre revalidados: a TV pega atualizações sem limpar cache
    location ~* \.(html|js|css|json)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Fotos: cache de 1 dia
    location /img/ {
        expires 1d;
        try_files $uri =404;
    }

    # Não expor arquivos de exemplo nem ocultos
    location = /config.example.json { return 404; }
    location ~ /\. { deny all; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
